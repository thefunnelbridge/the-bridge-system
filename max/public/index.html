<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <meta name="robots" content="noindex, nofollow">
  <title>Max</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/max.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="pantalla-mando">
  <div class="resplandor" aria-hidden="true"></div>
  <header class="barra-superior">
    <div class="marca">MAX</div>
    <div class="fecha" id="fecha"></div>
    <nav class="acciones" aria-label="Acciones">
      <button type="button" class="boton-icono" id="btn-silencio" aria-pressed="false" title="Silenciar a Max" aria-label="Silenciar a Max">
        <svg class="con-sonido" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></svg>
        <svg class="sin-sonido" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4.5 5"/><path d="M21.5 9.5l-4.5 5"/></svg>
      </button>
      <button type="button" class="boton-icono" id="btn-voz" title="Voz de Max" aria-label="Voz de Max">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4"/><path d="M9 6v12"/><path d="M13 9v6"/><path d="M17 4v16"/><path d="M21 10v4"/></svg>
      </button>
      <button type="button" class="boton-icono" id="btn-salir" title="Salir" aria-label="Salir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
      </button>
    </nav>
  </header>

  <main class="mando">
    <section class="col col-izq panel" aria-labelledby="t-meta">
      <h2 class="titulo-seccion" id="t-meta">Meta del departamento</h2>
      <div class="cifra cifra-principal">
        <span class="cifra-etiqueta" id="e-facturado">Facturado este mes</span>
        <span class="cifra-valor sin-dato" id="v-facturado">Sin dato</span>
      </div>
      <div class="cifra">
        <span class="cifra-etiqueta">Meta del mes</span>
        <span class="cifra-valor sin-dato" id="v-meta">Sin dato</span>
      </div>
      <div class="cifra">
        <span class="cifra-etiqueta">Falta</span>
        <span class="cifra-valor sin-dato" id="v-falta">Sin dato</span>
      </div>
      <div class="cifra">
        <span class="cifra-etiqueta">Hay que facturar por día hábil</span>
        <span class="cifra-valor sin-dato" id="v-por-dia">Sin dato</span>
      </div>
      <p class="aviso" id="aviso-meta"></p>
    </section>

    <section class="centro" aria-label="Max">
      <p class="saludo" id="saludo"></p>
      <button type="button" class="nucleo" id="nucleo" aria-label="Max. Toca para que te salude o para que se calle."></button>
      <p class="estado-max" id="estado-max">En espera</p>
      <p class="dicho" id="dicho" aria-live="polite"></p>
      <p class="aviso aviso-voz" id="aviso-voz"></p>
    </section>

    <section class="col col-der" aria-label="Actividad y gráficos">
      <div class="panel">
        <h2 class="titulo-seccion">Actividad</h2>
        <ul class="actividad" id="actividad"></ul>
      </div>
      <div class="panel">
        <h2 class="titulo-seccion">Facturación por día</h2>
        <div class="grafico vacio" id="grafico">Sin datos todavía.</div>
      </div>
    </section>
  </main>

  <footer class="barra-max">
    <form class="barra-form" id="form-barra">
      <label class="oculto" for="entrada">Escríbele a Max</label>
      <input id="entrada" type="text" autocomplete="off" placeholder="Muy pronto vas a poder escribirle o hablarle a Max" disabled>
      <button type="button" class="boton-icono" id="btn-mic" aria-label="Hablarle a Max" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <button type="submit" class="boton-primario" disabled>Enviar</button>
    </form>
  </footer>
  <dialog class="dialogo" id="dialogo-voz" aria-labelledby="t-voz">
    <h2 class="titulo-seccion" id="t-voz">Voz de Max</h2>
    <p class="dialogo-texto" id="voz-info"></p>
    <label class="dialogo-campo" id="voz-campo">
      <span>Voz</span>
      <select id="voz-lista"></select>
    </label>
    <div class="dialogo-botones">
      <button type="button" class="boton-secundario" id="voz-probar">Probar</button>
      <button type="button" class="boton-primario" id="voz-cerrar">Listo</button>
    </div>
  </dialog>
</body>
</html>
